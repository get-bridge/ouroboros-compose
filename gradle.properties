org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true

kotlin.code.style=official

android.nonTransitiveRClass=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# This is a library and does not use Compose Hot Reload. Disabling it removes the
# auto-registered hotReload tasks and their JetBrains Runtime toolchain dependency.
org.jetbrains.compose.hot.reload.disable=true
