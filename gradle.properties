org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true

kotlin.code.style=official

android.nonTransitiveRClass=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# This is a library that does not use Compose Hot Reload. Disabling it avoids the
# JetBrains Runtime (JBR 21) toolchain requirement, which cannot be provisioned on
# some CI platforms (e.g. macOS aarch64 via foojay) and breaks publishing.
org.jetbrains.compose.hot.reload.disable=true
